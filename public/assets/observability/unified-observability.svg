<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Zain Sudan × ONB — unified observability planning view</title><desc id="desc">Servers, applications, Oracle databases and network feed metrics, logs and traces into a unified platform for service health, alert triage and root-cause context. An illustrative planning concept.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="1598" height="898" rx="20" fill="#f9f7fc" stroke="#e7dfed"/><rect x="1" y="1" width="1598" height="151" rx="20" fill="#321342" stroke="none"/><rect x="1" y="121" width="1598" height="30" rx="0" fill="#321342" stroke="none"/><text x="52" y="48" font-size="20" fill="#d9bfe5" font-weight="600" >Zain Sudan × ONB</text><text x="52" y="101" font-size="38" fill="#fff" font-weight="600" >One environment. A unified operational view.</text><rect x="1325" y="42" width="213" height="24" rx="4" fill="#4b2b5c" stroke="none"/><text x="1334" y="58" font-size="11" fill="#d8c0e6" font-weight="500" >Illustrative solution view</text><text x="53" y="202" font-size="18" fill="#714881" font-weight="600" >Your environment</text><text x="425" y="202" font-size="18" fill="#714881" font-weight="600" >Collect &amp; correlate</text><text x="1030" y="202" font-size="18" fill="#714881" font-weight="600" >Understand &amp; act</text><rect x="50" y="224" width="290" height="438" rx="12" fill="#fff" stroke="#e1d7e8"/><rect x="70" y="252" width="47" height="47" rx="9" fill="#f2eaf7" stroke="none"/><path d="M82 264h23v22H82zM86 271h15m-15 7h10" fill="none" stroke="#9460a8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" /><text x="132" y="268" font-size="19" fill="#3a2649" font-weight="600" >Servers</text><text x="132" y="293" font-size="12" fill="#887291" font-weight="400" >Hosts · VMs · infrastructure</text><path d="M71 326H318" transform="translate(0 0)" stroke="#eee8f2" /><rect x="70" y="351" width="47" height="47" rx="9" fill="#f2eaf7" stroke="none"/><path d="M82 363h23v22H82zM86 370h15m-15 7h10" fill="none" stroke="#9460a8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" /><text x="132" y="367" font-size="19" fill="#3a2649" font-weight="600" >Applications</text><text x="132" y="392" font-size="12" fill="#887291" font-weight="400" >Services · APIs · transactions</text><path d="M71 425H318" transform="translate(0 0)" stroke="#eee8f2" /><rect x="70" y="450" width="47" height="47" rx="9" fill="#f2eaf7" stroke="none"/><path d="M82 462h23v22H82zM86 469h15m-15 7h10" fill="none" stroke="#9460a8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" /><text x="132" y="466" font-size="19" fill="#3a2649" font-weight="600" >Oracle databases</text><text x="132" y="491" font-size="12" fill="#887291" font-weight="400" >Sessions · query performance</text><path d="M71 524H318" transform="translate(0 0)" stroke="#eee8f2" /><rect x="70" y="549" width="47" height="47" rx="9" fill="#f2eaf7" stroke="none"/><path d="M82 561h23v22H82zM86 568h15m-15 7h10" fill="none" stroke="#9460a8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" /><text x="132" y="565" font-size="19" fill="#3a2649" font-weight="600" >Network</text><text x="132" y="590" font-size="12" fill="#887291" font-weight="400" >Links · traffic · availability</text><rect x="417" y="224" width="525" height="438" rx="12" fill="#fff" stroke="#e1d7e8"/><rect x="440" y="247" width="479" height="59" rx="8" fill="#f6f1f9" stroke="none"/><text x="461" y="283" font-size="18" fill="#634174" font-weight="600" >Approved collectors &amp; data sources</text><text x="441" y="341" font-size="15" fill="#8a7396" font-weight="400" >Connect the signals behind service health.</text><rect x="440" y="365" width="151" height="111" rx="9" fill="#fbf9fd" stroke="#e7deee"/><circle cx="458" cy="389" r="4" fill="#ae7ec6"/><text x="456" y="420" font-size="22" fill="#533261" font-weight="600" >Metrics</text><text x="456" y="449" font-size="13" fill="#8b7398" font-weight="400" >Patterns over time</text><rect x="604" y="365" width="151" height="111" rx="9" fill="#fbf9fd" stroke="#e7deee"/><circle cx="622" cy="389" r="4" fill="#7ea99e"/><text x="620" y="420" font-size="22" fill="#533261" font-weight="600" >Logs</text><text x="620" y="449" font-size="13" fill="#8b7398" font-weight="400" >Event context</text><rect x="768" y="365" width="151" height="111" rx="9" fill="#fbf9fd" stroke="#e7deee"/><circle cx="786" cy="389" r="4" fill="#c59c6e"/><text x="784" y="420" font-size="22" fill="#533261" font-weight="600" >Traces</text><text x="784" y="449" font-size="13" fill="#8b7398" font-weight="400" >Request journeys</text><path d="M515 489v24h327v-24M678 513v24" fill="none" stroke="#c5a9d4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="440" y="542" width="479" height="88" rx="9" fill="#5b2b6d" stroke="none"/><text x="462" y="577" font-size="23" fill="#fff" font-weight="600" >Unified observability</text><text x="462" y="606" font-size="15" fill="#dbc6e5" font-weight="400" >Dashboards · correlation · alert policies</text><path d="M341 441h39v-166h35M380 441v145h36" fill="none" stroke="#b89bc7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M944 585h37V442h45" fill="none" stroke="#b89bc7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1024" y="224" width="526" height="438" rx="12" fill="#fff" stroke="#e1d7e8"/><text x="1047" y="261" font-size="22" fill="#41284f" font-weight="600" >Operational control centre</text><text x="1047" y="288" font-size="15" fill="#8a7396" font-weight="400" >The context to prioritise the next action.</text><rect x="1047" y="315" width="479" height="74" rx="8" fill="#faf8fc" stroke="#ece5f1"/><circle cx="1071" cy="341" r="5" fill="#629c7d"/><text x="1087" y="346" font-size="18" fill="#5b3b6c" font-weight="600" >Service health</text><text x="1087" y="370" font-size="14" fill="#8a7396" font-weight="400" >See availability and performance</text><rect x="1047" y="403" width="479" height="74" rx="8" fill="#faf8fc" stroke="#ece5f1"/><circle cx="1071" cy="429" r="5" fill="#d29c58"/><text x="1087" y="434" font-size="18" fill="#5b3b6c" font-weight="600" >Alert triage</text><text x="1087" y="458" font-size="14" fill="#8a7396" font-weight="400" >Prioritise incident signals</text><rect x="1047" y="491" width="479" height="74" rx="8" fill="#faf8fc" stroke="#ece5f1"/><circle cx="1071" cy="517" r="5" fill="#9460a8"/><text x="1087" y="522" font-size="18" fill="#5b3b6c" font-weight="600" >Root-cause context</text><text x="1087" y="546" font-size="14" fill="#8a7396" font-weight="400" >Move between metrics, logs and traces</text><text x="1047" y="625" font-size="13" fill="#8a7396" font-weight="400" >Latency  /  throughput  /  availability  /  incidents</text><rect x="50" y="700" width="1500" height="112" rx="12" fill="#eee6f4" stroke="none"/><text x="77" y="741" font-size="24" fill="#5d356e" font-weight="600" >A discovery-led architecture. A clearer operating picture.</text><text x="77" y="777" font-size="18" fill="#876695" font-weight="400" >Map business priorities to signal coverage, integrations, capacity and response expectations.</text><text x="53" y="856" font-size="14" fill="#90799e" font-weight="400" >Planning concept only. Integration methods, Oracle data sources, plugins and licensing require validation.</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#b89bc7" stroke-width="1.5"/></marker></defs></g></svg>